apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace
  - ibm-mq
  - ../../legacy-oms-soap/deploy/k8s/base
  - ../../ems-broker/deploy/k8s/base
  - ../../erp-mq-consumer/deploy/k8s/base
  - ../../store-pos-simulator/k8s
