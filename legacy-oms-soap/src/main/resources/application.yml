server:
  port: 8085

spring:
  application:
    name: legacy-oms-soap
  datasource:
    # H2 in Oracle compatibility mode: VARCHAR2/NUMBER types, sequences with .NEXTVAL, DUAL, NULLs sort high
    url: jdbc:h2:mem:oms;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: OMS
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: INFO
    com.tailoredbrands: INFO
    org.springframework.ws: INFO
