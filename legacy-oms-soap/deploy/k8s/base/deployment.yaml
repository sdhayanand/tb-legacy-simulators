apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-oms-soap
  labels:
    app: legacy-oms-soap
spec:
  # Deliberately a single replica: the simulated OMS keeps its "Oracle" data in an in-memory H2 database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: legacy-oms-soap
  template:
    metadata:
      labels:
        app: legacy-oms-soap
    spec:
      serviceAccountName: legacy-oms-soap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legacy-oms-soap
          image: ghcr.io/sdhayanand/tb-legacy-oms-soap:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: legacy-oms-soap
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
