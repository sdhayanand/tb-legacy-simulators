server:
  port: 8087

spring:
  application:
    name: erp-mq-consumer
  jms:
    pub-sub-domain: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

erp:
  jms:
    # ibmmq (default) or artemis (connects to ems-broker; used by docker-compose and CI)
    provider: ${JMS_PROVIDER:ibmmq}
    queue: ${MQ_QUEUE:ERP.ORDERS.IN}
    concurrency: ${JMS_CONCURRENCY:1-3}
    keep-last: 500
    ibmmq:
      host: ${MQ_HOST:localhost}
      port: ${MQ_PORT:1414}
      queue-manager: ${MQ_QMGR:QM1}
      channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
      user: ${MQ_USER:app}
      password: ${MQ_PASSWORD:}
      app-name: tb-erp-consumer
    artemis:
      url: ${JMS_URL:tcp://localhost:61616}
      user: ${JMS_USER:}
      password: ${JMS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # The JMS health indicator opens a connection on every probe; keep it but do not fail readiness while MQ is down
    jms:
      enabled: true

logging:
  level:
    root: INFO
    com.tailoredbrands: INFO
    com.ibm.msg.client: WARN
